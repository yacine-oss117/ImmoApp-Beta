name: Nightly Heavy Checks

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      ALE_KEY_VERSION: v1
      ALE_MASTER_KEY: nightly-master-key-32-bytes-minimum
      ALE_SEARCH_SECRET: nightly-search-secret
      ALE_KDF_SALT: nightly-kdf-salt
      IMMOAPP_REQUIRE_ALE_KEY: "1"
      POSTGRES_DB: immoapp
      POSTGRES_USER: immoapp_app
      POSTGRES_PASSWORD: immoapp_app_pw
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_ADMIN_USER: immoapp_app
      POSTGRES_ADMIN_PASSWORD: immoapp_app_pw
      VALKEY_URL: redis://127.0.0.1:6379/1
      CHANNEL_LAYER_URL: redis://127.0.0.1:6379/3
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      STORAGE_ENDPOINT_URL: http://127.0.0.1:9000
      STORAGE_ACCESS_KEY: immoapp
      STORAGE_SECRET_KEY: immoapp_minio_pw
      STORAGE_BUCKET: immoapp
      STORAGE_REGION: us-east-1
      STORAGE_USE_SSL: "0"
      MINIO_ROOT_USER: immoapp
      MINIO_ROOT_PASSWORD: immoapp_minio_pw
      DJANGO_SETTINGS_MODULE: server.immoapp_server.settings
      DJANGO_SECRET_KEY: nightly-secret-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_DEBUG: "1"
      PYTHONPATH: .
      IMMOAPP_ENV: "ci"
      IMMOAPP_ALLOW_ENV_SECRETS: "1"
      IMMOAPP_SECRETS_BACKEND: env
      IMMOAPP_RUN_RESTORE_DRILL: "1"
      IMMOAPP_ENFORCE_NO_SECRETS: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: immoapp
          POSTGRES_USER: immoapp_app
          POSTGRES_PASSWORD: immoapp_app_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U immoapp_app -d immoapp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Start MinIO (official pinned image)
        run: |
          docker run -d --name immoapp-ci-minio --pull=always \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=immoapp \
            -e MINIO_ROOT_PASSWORD=immoapp_minio_pw \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for attempt in {1..45}; do
            if curl --fail --silent --show-error http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "MinIO is ready"
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              echo "MinIO did not become ready" >&2
              docker logs immoapp-ci-minio || true
              exit 1
            fi
            sleep 2
          done
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Install deps + scanners
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/server.txt -r requirements/client.txt
          pip install bandit pip-audit
      - name: Wait for services
        run: |
          python - <<'PY'
          import socket, time
          targets = [("127.0.0.1",5432,"postgres"),("127.0.0.1",6379,"redis"),("127.0.0.1",9000,"minio")]
          deadline = time.time() + 90
          for host, port, name in targets:
              ok = False
              while time.time() < deadline:
                  s = socket.socket()
                  s.settimeout(1.0)
                  try:
                      s.connect((host, port))
                      ok = True
                      break
                  except OSError:
                      time.sleep(1.0)
                  finally:
                      s.close()
              if not ok:
                  raise SystemExit(f"{name} not ready on {host}:{port}")
          print("all services ready")
          PY
      - name: Full merge lane baseline
        run: |
          python -m black --check app server core
          python -m ruff check app server core
          python -m mypy .
          python -m pytest app/tests/server_tests -m "not integration and not slow and not perf and not e2e and not nightly"
          python -m pytest app/tests/server_tests -m "integration or e2e"
          python -m pytest app/tests/ui_tests
          python scripts/verify_prod_config.py
          python scripts/verify_no_secrets.py
          python scripts/verify_write_policies.py
      - name: Nightly heavy suites
        run: |
          python scripts/verify_restore_drill_assets.py
          python scripts/verify_restore_drill_execution.py
          python scripts/run_game_day_drill.py
          python scripts/verify_game_day_automation.py
          python scripts/verify_dast_smoke.py
          python scripts/verify_query_budgets.py
          python scripts/verify_load_baseline.py
          python scripts/verify_api_queue_baseline.py

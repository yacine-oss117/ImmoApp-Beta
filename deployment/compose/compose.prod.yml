    command:
      [
        "sh",
        "-ec",
        "python -m server.secret_store.openbao_runtime_bootstrap && exec python -m celery -A server.immoapp_server.celery:celery_app worker -l info -Q match_pairs -c ${CELERY_MATCH_PAIRS_CONCURRENCY_DOCKER:?hub_runtime_profile_required}",
      ]

  caddy:
    environment:
      IMMOAPP_UPSTREAM: web:8000
      IMMOAPP_TLS_DOMAIN: ${IMMOAPP_TLS_DOMAIN?set_public_tls_domain}
    volumes:
      - ./deployment/proxy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

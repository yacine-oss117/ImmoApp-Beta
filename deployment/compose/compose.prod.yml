      IMMOAPP_MATCH_REBUILD_LOCK_TIMEOUT_MS: "5000"
      IMMOAPP_MATCH_PAIRS_DEMANDE_BATCH_SIZE: ${IMMOAPP_MATCH_PAIRS_DEMANDE_BATCH_SIZE_DOCKER:?hub_runtime_profile_required}
      MATCH_CACHE_DB_BATCH_SIZE: ${MATCH_CACHE_DB_BATCH_SIZE_DOCKER:?hub_runtime_profile_required}
      IMMOAPP_MATCH_PAIRS_TASK_CHUNK_SIZE: ${IMMOAPP_MATCH_PAIRS_TASK_CHUNK_SIZE_DOCKER:-1000}
      IMMOAPP_MATCH_PAIRS_FULL_SQL_THRESHOLD: ${IMMOAPP_MATCH_PAIRS_FULL_SQL_THRESHOLD_DOCKER:-250}

  worker-import:
    environment:
      <<: [*prod-security, *prod-openbao-tls]
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER?required}:${RABBITMQ_PASSWORD?required}@rabbitmq:5672//
      IMMOAPP_HUB_RESOLVED_PROFILE: ${IMMOAPP_HUB_RESOLVED_PROFILE:?hub_runtime_profile_required}
      IMMOAPP_HUB_PROFILE_EXPORT_MODE: ${IMMOAPP_HUB_PROFILE_EXPORT_MODE:?hub_runtime_profile_required}
      IMMOAPP_HUB_PROFILE_SOURCE: ${IMMOAPP_HUB_PROFILE_SOURCE_DOCKER:?hub_runtime_profile_required}
      IMMOAPP_HUB_PROFILE_SOURCE_DETAIL: ${IMMOAPP_HUB_PROFILE_SOURCE_DETAIL:?hub_runtime_profile_required}
      IMMOAPP_HUB_DETECTION_SOURCE: ${IMMOAPP_HUB_DETECTION_SOURCE:?hub_runtime_profile_required}
      IMMOAPP_HUB_CPU_BUDGET: ${IMMOAPP_HUB_CPU_BUDGET:?hub_runtime_profile_required}
      IMMOAPP_HUB_MEMORY_GB: ${IMMOAPP_HUB_MEMORY_GB:?hub_runtime_profile_required}
      IMMOAPP_HUB_WORKER_CONCURRENCY: ${IMMOAPP_HUB_WORKER_CONCURRENCY:?hub_runtime_profile_required}
      IMMOAPP_HUB_IMPORT_CONCURRENCY: ${IMMOAPP_HUB_IMPORT_CONCURRENCY:?hub_runtime_profile_required}
      IMMOAPP_HUB_MATCH_CONCURRENCY: ${IMMOAPP_HUB_MATCH_CONCURRENCY:?hub_runtime_profile_required}
      IMMOAPP_HUB_DB_POOL_MAX: ${IMMOAPP_HUB_DB_POOL_MAX:?hub_runtime_profile_required}
      IMMOAPP_HUB_DEFAULT_BATCH_SIZE: ${IMMOAPP_HUB_DEFAULT_BATCH_SIZE:?hub_runtime_profile_required}
      IMMOAPP_MATCH_BUILD_PIPELINE: direct
      IMMOAPP_MATCH_RUNTIME_PROFILE: auto
      IMMOAPP_MATCH_REBUILD_STATEMENT_TIMEOUT_MS: "120000"
      IMMOAPP_MATCH_REBUILD_LOCK_TIMEOUT_MS: "5000"
      IMMOAPP_MATCH_PAIRS_DEMANDE_BATCH_SIZE: ${IMMOAPP_MATCH_PAIRS_DEMANDE_BATCH_SIZE_DOCKER:?hub_runtime_profile_required}
      MATCH_CACHE_DB_BATCH_SIZE: ${MATCH_CACHE_DB_BATCH_SIZE_DOCKER:?hub_runtime_profile_required}
      IMMOAPP_MATCH_PAIRS_TASK_CHUNK_SIZE: ${IMMOAPP_MATCH_PAIRS_TASK_CHUNK_SIZE_DOCKER:-1000}
      IMMOAPP_MATCH_PAIRS_FULL_SQL_THRESHOLD: ${IMMOAPP_MATCH_PAIRS_FULL_SQL_THRESHOLD_DOCKER:-250}
    command:
      [
        "sh",
        "-ec",
        "python -m server.secret_store.openbao_runtime_bootstrap && exec python -m celery -A server.immoapp_server.celery:celery_app worker -l info -Q imports -c ${CELERY_IMPORT_CONCURRENCY_DOCKER:?hub_runtime_profile_required}",
      ]

  beat:
    environment:
      <<: [*prod-security, *prod-openbao-tls]
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER?required}:${RABBITMQ_PASSWORD?required}@rabbitmq:5672//
      IMMOAPP_HUB_RESOLVED_PROFILE: ${IMMOAPP_HUB_RESOLVED_PROFILE:?hub_runtime_profile_required}
      IMMOAPP_HUB_PROFILE_EXPORT_MODE: ${IMMOAPP_HUB_PROFILE_EXPORT_MODE:?hub_runtime_profile_required}
      IMMOAPP_HUB_PROFILE_SOURCE: ${IMMOAPP_HUB_PROFILE_SOURCE_DOCKER:?hub_runtime_profile_required}
      IMMOAPP_HUB_PROFILE_SOURCE_DETAIL: ${IMMOAPP_HUB_PROFILE_SOURCE_DETAIL:?hub_runtime_profile_required}
      IMMOAPP_HUB_DETECTION_SOURCE: ${IMMOAPP_HUB_DETECTION_SOURCE:?hub_runtime_profile_required}
      IMMOAPP_HUB_CPU_BUDGET: ${IMMOAPP_HUB_CPU_BUDGET:?hub_runtime_profile_required}
